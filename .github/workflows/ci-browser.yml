name: CI (gapr-browser)

on:
  push:
    branches: [main]
    paths:
      - "gapr-browser.ts"
      - "gapr-browser-wrapper"
      - "tests/unit/test_gapr_browser.ts"
      - "tsconfig.json"
      - "package.json"
      - ".github/workflows/ci-browser.yml"
  pull_request:
    branches: [main]
    paths:
      - "gapr-browser.ts"
      - "gapr-browser-wrapper"
      - "tests/unit/test_gapr_browser.ts"
      - "tsconfig.json"
      - "package.json"
      - ".github/workflows/ci-browser.yml"
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: TypeScript 型チェック
        run: npm run typecheck

  # ─────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - run: npm ci

      - name: ユニットテスト実行
        run: npm test

      - name: テスト結果アップロード
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-node${{ matrix.node }}
          path: test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  dry-run-smoke:
    name: Dry-run Smoke Test
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: ワークフロー設定作成（CI用モックデータ）
        run: |
          mkdir -p .apr/workflows .apr/rounds/ci-test
          cat > .apr/workflows/ci-test.yaml << 'EOF'
          name: ci-test
          description: "CI smoke test workflow"
          documents:
            readme: "README.md"
            spec: "SPEC.md"
          model: "gemini-2.5-pro-preview-05-06"
          rounds:
            output_dir: ".apr/rounds/ci-test"
          EOF

      - name: dry-run スモークテスト（Chrome 不要）
        run: |
          node_modules/.bin/tsx gapr-browser.ts run -w ci-test --dry-run --quiet 2>&1 \
            | tee /tmp/dry-run-output.txt

          # プロンプトが生成されていることを確認
          if grep -q "レビュー観点\|DRY RUN\|chars" /tmp/dry-run-output.txt; then
            echo "✅ dry-run: プロンプト生成 OK"
          else
            echo "❌ dry-run: 期待する出力が得られません"
            cat /tmp/dry-run-output.txt
            exit 1
          fi

      - name: help コマンド確認
        run: |
          node_modules/.bin/tsx gapr-browser.ts help | tee /tmp/help-output.txt
          # 必須コマンドが help に含まれているか（LC_ALL=C で多バイト文字を回避）
          for cmd in "daemon" "run" "setup" "list" "history" "status" "stop" "dry-run" "quiet"; do
            if LC_ALL=C grep -q "$cmd" /tmp/help-output.txt; then
              echo "  ✅ $cmd"
            else
              echo "  ❌ '$cmd' が help に見つかりません"
              LC_ALL=C cat /tmp/help-output.txt
              exit 1
            fi
          done

      - name: list コマンド確認
        run: |
          node_modules/.bin/tsx gapr-browser.ts list 2>&1 | tee /tmp/list-output.txt
          echo "✅ list: 正常終了"

  # ─────────────────────────────────────────────────────────────────────────
  shell-lint:
    name: Shell Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n で構文チェック
        run: |
          bash -n gapr-browser-wrapper
          echo "✅ gapr-browser-wrapper 構文 OK"

      - name: ShellCheck (gapr-browser-wrapper のみ)
        run: |
          shellcheck --severity=warning gapr-browser-wrapper
          echo "✅ shellcheck: gapr-browser-wrapper OK"
